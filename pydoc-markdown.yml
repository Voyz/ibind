loaders:
  - type: python
    search_path: [ "ibind" ]

processors:
  - type: filter
  - type: google

#
# After generating do following:
# - Cleanup regex:
#   - (\*\*)(Arguments|Notes|Raises|Returns|Attributes)(\*\*)
#   - $2
# - Reduce TOCs by removing the level 0 items
# - Move SubscriptionController and WsClient entries to the bottom of the IbkrWsClient, and remove these
renderer:
  type: mkdocs
  mkdocs_config:
    output_directory: ./docs
    content_directory_name: api_reference
    docs_dir: api_reference
  markdown:
    encoding: utf-8
    descriptive_module_title: True
    render_module_header: False
    insert_header_anchors: True
    code_headers: False
    descriptive_class_title: False
    add_module_prefix: False
    add_method_class_prefix: False
    signature_code_block: True
    render_page_title: False
    classdef_code_block: False
    render_toc: True
    use_fixed_header_levels: True
    header_level_by_type:
      Module: 1
      Class: 2
      Method: 3
      Function: 2
      Data: 4

  pages:
    - title: API IbkrClient
      name: ibkr_client
      contents:
        - client.ibkr_client.IbkrClient.*
        - base.rest_client.Result

    - title: API IbkrClient Accounts Mixin
      name: ibkr_client/accounts_mixin
      contents:
        - client.ibkr_client_mixins.accounts_mixin.*

    - title: API IbkrClient Contract Mixin
      name: ibkr_client/contract_mixin
      contents:
        - client.ibkr_client_mixins.contract_mixin.*

    - title: API IbkrClient FA Mixin
      name: ibkr_client/fa_mixin
      contents:
        - client.ibkr_client_mixins.fa_mixin.*

    - title: API IbkrClient Marketdata Mixin
      name: ibkr_client/marketdata_mixin
      contents:
        - client.ibkr_client_mixins.marketdata_mixin.*

    - title: API IbkrClient Order Mixin
      name: ibkr_client/order_mixin
      contents:
        - client.ibkr_client_mixins.order_mixin.*

    - title: API IbkrClient Portfolio Mixin
      name: ibkr_client/portfolio_mixin
      contents:
        - client.ibkr_client_mixins.portfolio_mixin.*

    - title: API IbkrClient Scanner Mixin
      name: ibkr_client/scanner_mixin
      contents:
        - client.ibkr_client_mixins.scanner_mixin.*

    - title: API IbkrClient Session Mixin
      name: ibkr_client/session_mixin
      contents:
        - client.ibkr_client_mixins.session_mixin.*

    - title: API IbkrClient Watchlist Mixin
      name: ibkr_client/watchlist_mixin
      contents:
        - client.ibkr_client_mixins.watchlist_mixin.*

    - title: API IbkWsClient
      name: ibkr_ws_client
      contents:
        - ibkr_ws.ibkr_ws_client.*
        - ws.ws_subscriptions.Subscription.*
        - ws.ws_subscriptions.BindingStatus.*
        - ws.ws_subscriptions.SubscriptionUpdated
        - ws.ws_subscriptions.Binding.*
        - ws.ws_subscriptions.SubscriptionHandle.*

    - title: API Subscriptions
      name: ibkr_ws_subscriptions
      contents:
        - ibkr_ws.ibkr_subscriptions.AccountSummarySubscription
        - ibkr_ws.ibkr_subscriptions.AccountLedgerSubscription
        - ibkr_ws.ibkr_subscriptions.MarketDataSubscription
        - ibkr_ws.ibkr_subscriptions.MarketHistorySubscription
        - ibkr_ws.ibkr_subscriptions.OrdersSubscription
        - ibkr_ws.ibkr_subscriptions.PriceLadderSubscription
        - ibkr_ws.ibkr_subscriptions.PnlSubscription
        - ibkr_ws.ibkr_subscriptions.TradesSubscription

    - title: API Events
      name: ibkr_ws_events
      contents:
        - ws._ws_events.*
        - ibkr_ws.ibkr_events.*

    - title: API Sinks
      name: ibkr_ws_sinks
      contents:
        - ws.ws_sinks.*

    - title: API Utils
      name: utils
      contents:
        - client.ibkr_utils.StockQuery
        - client.ibkr_utils.OrderRequest
        - support.py_utils.execute_in_parallel
        - support.logs.ibind_logs_initialize
